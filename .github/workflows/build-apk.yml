name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: STELLIVE_ANDROID

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: stellive-star-collector-debug-apk
          path: STELLIVE_ANDROID/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
